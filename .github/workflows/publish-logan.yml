name: Publish LOGAN

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 1.0.1, 1.1.0)'
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Install dependencies
        run: bun install

      - name: Build binary
        working-directory: packages/opencode
        env:
          OPENCODE_VERSION: ${{ inputs.version }}
          OPENCODE_CHANNEL: latest
        run: bun run script/build.ts --single --skip-install

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: logan-linux-${{ matrix.arch }}
          path: packages/opencode/dist/logan-linux-${{ matrix.arch }}/
          retention-days: 1

  build-macos:
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
          - runner: macos-13
            arch: x64
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Install dependencies
        run: bun install

      - name: Build binary
        working-directory: packages/opencode
        env:
          OPENCODE_VERSION: ${{ inputs.version }}
          OPENCODE_CHANNEL: latest
        run: bun run script/build.ts --single --skip-install

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: logan-darwin-${{ matrix.arch }}
          path: packages/opencode/dist/logan-darwin-${{ matrix.arch }}/
          retention-days: 1

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Install dependencies
        run: bun install

      - name: Build binary
        working-directory: packages/opencode
        env:
          OPENCODE_VERSION: ${{ inputs.version }}
          OPENCODE_CHANNEL: latest
        run: bun run script/build.ts --single --skip-install

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: logan-windows-x64
          path: packages/opencode/dist/logan-windows-x64/
          retention-days: 1

  publish:
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: packages/opencode/dist/

      - name: List artifacts
        run: |
          echo "=== Downloaded artifacts ==="
          ls -la packages/opencode/dist/
          for dir in packages/opencode/dist/*/; do
            echo "=== $dir ==="
            ls -la "$dir"
          done

      - name: Publish platform binaries
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION="${{ inputs.version }}"
          
          for platform in linux-x64 linux-arm64 darwin-arm64 darwin-x64 windows-x64; do
            dir="packages/opencode/dist/logan-${platform}"
            if [ -d "$dir" ]; then
              echo "========================================="
              echo "Publishing logan-${platform}@${VERSION}"
              echo "========================================="
              
              # Determine OS for package.json
              os_name=$(echo $platform | cut -d'-' -f1)
              case $os_name in
                windows) os_json="win32" ;;
                darwin) os_json="darwin" ;;
                linux) os_json="linux" ;;
              esac
              
              arch_name=$(echo $platform | cut -d'-' -f2)
              
              # Create package.json for binary package
              cat > "$dir/package.json" << EOF
          {
            "name": "logan-${platform}",
            "version": "${VERSION}",
            "os": ["${os_json}"],
            "cpu": ["${arch_name}"],
            "license": "MIT"
          }
          EOF
              
              echo "Package.json contents:"
              cat "$dir/package.json"
              
              cd "$dir"
              npm publish --access public
              cd - > /dev/null
            else
              echo "Warning: Directory $dir not found"
            fi
          done

      - name: Prepare main package
        run: |
          VERSION="${{ inputs.version }}"
          mkdir -p packages/opencode/dist/logan-ai
          cp -r packages/opencode/bin packages/opencode/dist/logan-ai/
          cp packages/opencode/script/postinstall.mjs packages/opencode/dist/logan-ai/
          
          cat > packages/opencode/dist/logan-ai/package.json << EOF
          {
            "name": "logan-ai",
            "version": "${VERSION}",
            "description": "LOGAN - Your Personal AI Coding Agent. Open-source, multi-provider, runs in your terminal.",
            "author": "Yuval Avidani <yuval@yuv.ai> (https://yuv.ai)",
            "homepage": "https://github.com/hoodini/logan",
            "repository": {
              "type": "git",
              "url": "git+https://github.com/hoodini/logan.git"
            },
            "license": "MIT",
            "keywords": ["ai", "coding-assistant", "cli", "terminal", "llm", "claude", "openai", "gpt", "copilot", "agent", "logan"],
            "bin": {
              "logan": "./bin/opencode"
            },
            "scripts": {
              "postinstall": "node ./postinstall.mjs || true"
            },
            "optionalDependencies": {
              "logan-windows-x64": "${VERSION}",
              "logan-darwin-arm64": "${VERSION}",
              "logan-darwin-x64": "${VERSION}",
              "logan-linux-x64": "${VERSION}",
              "logan-linux-arm64": "${VERSION}"
            }
          }
          EOF

      - name: Publish main package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd packages/opencode/dist/logan-ai
          npm publish --access public

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ inputs.version }}
          name: LOGAN v${{ inputs.version }}
          generate_release_notes: true
          draft: false
          files: |
            packages/opencode/dist/logan-linux-x64/bin/logan
            packages/opencode/dist/logan-linux-arm64/bin/logan
            packages/opencode/dist/logan-darwin-x64/bin/logan
            packages/opencode/dist/logan-darwin-arm64/bin/logan
            packages/opencode/dist/logan-windows-x64/bin/logan.exe
